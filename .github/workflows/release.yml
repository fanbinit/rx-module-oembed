name: Release Bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bundle (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Stage module under oembed/
        run: |
          mkdir -p staging/oembed
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='staging' \
            ./ staging/oembed/

      - name: Create archive
        id: archive
        run: |
          VERSION="${TAG#v}"
          ZIP="oembed-${VERSION}.zip"
          (cd staging && zip -r "../${ZIP}" oembed)
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ steps.archive.outputs.zip }}
        run: gh release upload "$TAG" "$ZIP" --clobber
